<!-- Cover Image 1: Real Estate Management System -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg1)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" />
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" />
  </g>

  <!-- Left Accent Line -->
  <rect x="80" y="80" width="6" height="470" fill="url(#accent1)" rx="3"/>

  <!-- Category Pills -->
  <g transform="translate(110, 110)">
    <rect x="0" y="0" width="70" height="28" rx="14" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-opacity="0.3"/>
    <text x="35" y="18" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">SaaS</text>

    <rect x="78" y="0" width="50" height="28" rx="14" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-opacity="0.3"/>
    <text x="103" y="18" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">AI</text>

    <rect x="136" y="0" width="150" height="28" rx="14" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-opacity="0.3"/>
    <text x="211" y="18" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cloud &amp; Automation</text>

    <rect x="294" y="0" width="90" height="28" rx="14" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-opacity="0.3"/>
    <text x="339" y="18" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Full-Stack</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="110" y="210" fill="#ffffff" font-family="sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Real Estate</text>
  <text x="110" y="265" fill="#ffffff" font-family="sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Management System</text>
  <text x="110" y="315" fill="#94a3b8" font-family="sans-serif" font-size="20" font-weight="400">Multi-tenant AI platform automating agency operations</text>

  <!-- Tech Stack Icon Cards Section -->
  <text x="110" y="415" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">TECH STACK</text>
  
  <g transform="translate(110, 435)">
    <!-- React Icon Card -->
    <rect x="0" y="0" width="110" height="50" rx="10" fill="#1e293b" stroke="#334155"/>
    <g transform="translate(14, 13)">
      <ellipse cx="12" cy="12" rx="10" ry="4.5" fill="none" stroke="#61dafb" stroke-width="1.5" transform="rotate(30 12 12)"/>
      <ellipse cx="12" cy="12" rx="10" ry="4.5" fill="none" stroke="#61dafb" stroke-width="1.5" transform="rotate(90 12 12)"/>
      <ellipse cx="12" cy="12" rx="10" ry="4.5" fill="none" stroke="#61dafb" stroke-width="1.5" transform="rotate(150 12 12)"/>
      <circle cx="12" cy="12" r="2" fill="#61dafb"/>
    </g>
    <text x="48" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600">React</text>

    <!-- Python Icon Card -->
    <rect x="122" y="0" width="120" height="50" rx="10" fill="#1e293b" stroke="#334155"/>
    <g transform="translate(136, 13)">
      <path d="M11.8 1c-5.2 0-4.8 2.2-4.8 2.2l.1 2.3h4.8v.7H5.2S1 5.7 1 11c0 5.2 3.7 5 3.7 5h2.2v-3.1s-.1-3.7 3.7-3.7h6.3s3.5 0 3.5-3.5V5.2S20.9 1 11.8 1zm-2.6 1.7a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" fill="#387eb8"/>
      <path d="M12.2 23c5.2 0 4.8-2.2 4.8-2.2l-.1-2.3h-4.8v-.7h6.7s4.2.5 4.2-4.8c0-5.2-3.7-5-3.7-5h-2.2v3.1s.1 3.7-3.7 3.7H7.2s-3.5 0-3.5 3.5v3.6s-.5 4.2 8.5 4.2zm2.6-1.7a1 1 0 1 1 0-2 1 1 0 0 1 0 2z" fill="#ffe052"/>
    </g>
    <text x="170" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600">Python</text>

    <!-- FastAPI Icon Card -->
    <rect x="254" y="0" width="120" height="50" rx="10" fill="#1e293b" stroke="#334155"/>
    <g transform="translate(268, 13)">
      <circle cx="12" cy="12" r="11" fill="#059669"/>
      <path d="M13 3L6 14h5l-1 7 8-11h-5l1-7z" fill="#ffffff"/>
    </g>
    <text x="300" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600">FastAPI</text>

    <!-- LangGraph Icon Card -->
    <rect x="386" y="0" width="140" height="50" rx="10" fill="#1e293b" stroke="#334155"/>
    <g transform="translate(400, 13)">
      <circle cx="6" cy="6" r="3" fill="#a855f7"/>
      <circle cx="18" cy="6" r="3" fill="#a855f7"/>
      <circle cx="12" cy="18" r="3" fill="#a855f7"/>
      <line x1="6" y1="6" x2="12" y2="18" stroke="#a855f7" stroke-width="1.5"/>
      <line x1="18" y1="6" x2="12" y2="18" stroke="#a855f7" stroke-width="1.5"/>
      <line x1="6" y1="6" x2="18" y2="6" stroke="#a855f7" stroke-width="1.5"/>
    </g>
    <text x="432" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600">LangGraph</text>

    <!-- OpenAI Icon Card -->
    <rect x="538" y="0" width="125" height="50" rx="10" fill="#1e293b" stroke="#334155"/>
    <g transform="translate(552, 13)">
      <path d="M22.2 9.2a6 6 0 0 0-.5-5.2 6.1 6 0 0 0-6.6-2.8 6 6 0 0 0-4.8-2.4 6.1 6 0 0 0-5.8 4.1 6 6 0 0 0-4.2 3 6.1 6 0 0 0 .8 7.1 6 6 0 0 0 .5 5.2 6.1 6 0 0 0 6.6 2.8 6 6 0 0 0 4.8 2.4 6.1 6 0 0 0 5.8-4.1 6 6 0 0 0 4.2-3 6.1 6 0 0 0-.8-7.1z" fill="none" stroke="#10b981" stroke-width="1.5"/>
    </g>
    <text x="582" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600">OpenAI</text>
  </g>
</svg>
