<!doctype html><html class="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="base.css"><style>
:root{--accent:#111111;--display:"Fraunces",Georgia,serif}
html.light{--bg:#f4f4f2;--panel:#ffffff;--panel-2:#ebebe8;--line:rgba(0,0,0,.1);--soft:rgba(0,0,0,.05);--on-accent:#ffffff}
.logo{font-weight:300;font-size:18px;letter-spacing:.42em;text-transform:uppercase}
.btn{border-radius:999px;font-weight:500}
.quiz{padding:36px 40px 0;max-width:960px;margin:0 auto;width:100%}
.prog{display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.prog .bar{flex:1;height:3px;background:var(--soft)}.prog .bar i{background:var(--text)}
.quiz h1{font-family:var(--display);font-weight:300;font-size:36px;letter-spacing:-.01em;margin-top:22px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
.opt{border:1.5px solid transparent;border-radius:14px;padding:6px;background:var(--panel)}
.opt.on{border-color:var(--text)}
.opt .ph{aspect-ratio:4/4.4;border-radius:10px;min-height:0}
.opt b{display:block;font-weight:500;font-size:13px;margin:10px 6px 2px}
.opt small{display:block;color:var(--muted);margin:0 6px 8px;font-size:11.5px}
.nav2{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
@media (max-width:600px){.quiz{padding:26px 22px 0}.quiz h1{font-size:28px}.opts{grid-template-columns:1fr 1fr;gap:10px}.opt .ph{aspect-ratio:1}}
</style></head><body>
<div class="site">
 <div class="navbar line"><div class="logo">Curio</div><div class="links"><span>Marketplace</span><span>Moods</span><span>Sellers</span></div><div class="row"><span class="muted small d-only">Save &amp; exit</span><span class="burger"></span></div></div>
 <div class="page">
  <div class="quiz">
   <div class="prog"><span>Taste quiz</span><div class="bar"><i style="width:37%"></i></div><span>3 / 8</span></div>
   <h1>Which room would you rather come home to?</h1>
   <div class="opts">
    <div class="opt on"><div class="ph" style="--img:linear-gradient(160deg,#e9e2d6,#b9ab97)"></div><b>Warm minimal</b><small>Linen, oak, soft light</small></div>
    <div class="opt"><div class="ph" style="--img:linear-gradient(160deg,#2f3a3a,#0f1717)"></div><b>Moody</b><small>Dark walls, brass, velvet</small></div>
    <div class="opt"><div class="ph" style="--img:linear-gradient(160deg,#f0e4e4,#d8a7a7)"></div><b>Playful</b><small>Colour blocks, curves</small></div>
    <div class="opt"><div class="ph" style="--img:linear-gradient(160deg,#dfe7e2,#8ea89b)"></div><b>Botanical</b><small>Plants, rattan, clay</small></div>
   </div>
   <div class="nav2"><span class="btn ghost">Back</span><span class="muted small d-only">Your answers shape recommendations, not ads.</span><span class="btn">Next</span></div>
  </div>
 </div>
</div></body></html>
